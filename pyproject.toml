[project]
name = "graphnet-pr-852"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "colorlog>=6.6",
    "configupdater",
    "dill>=0.3",
    "matplotlib>=3.5",
    "numpy>=1.22,<2.0",
    "pandas>=1.3",
    "pyarrow",
    "pydantic",
    "ruamel.yaml",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "sqlalchemy>=1.4",
    "tqdm>=4.64",
    "wandb>=0.12",
    "polars >=0.19",
    "torchscale==0.2.0",
    "h5py>= 3.7.0",
    "lmdb>=1.4.1",
    "torch==2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "marimo[mcp]>=0.20.4",
    "msgpack>=1.1.2",
]


[build-system]
requires = ["setuptools>=68.2.2", "wheel", "versioneer", "packaging>=23.3"]
build-backend = "setuptools.build_meta"

[tool.pip]
index-url = "https://download.pytorch.org/whl/cu128"

# PyG packages (pyg_lib, torch_scatter, etc.) are not on PyPI; use their wheel index
[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.7.0+cu128.html"
format = "flat"

# Limit resolution to Linux only (pyg-lib has no Windows wheels)
[tool.uv]
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "black",
    "coverage",
    "docformatter",
    "MarkupSafe<=2.1",
    "mypy",
    "myst-parser",
    "pre-commit<4.0",
    "pydocstyle",
    "pylint",
    "pytest",
    "pytest-order",
    "sphinx",
    "sphinx-material",
    "sphinx-autodoc-typehints",
    "versioneer",
    "flake8",
    "marimo[recommended]>=0.20.4",
]

[project.optional-dependencies]
torch-27 = [
    "torch==2.7.0",
    "torch-geometric",
    "pyg_lib",
    "torch_scatter",
    "torch_sparse",
    "torch_cluster",
    "torch_spline_conv",
    "pytorch-lightning>=2.0",
]
