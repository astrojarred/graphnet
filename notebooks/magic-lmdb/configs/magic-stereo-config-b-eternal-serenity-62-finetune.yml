arguments:
  backbone:
    ModelConfig:
      arguments:
        add_global_variables_after_pooling: true
        add_norm_layer: true
        add_stereo_global_features: true
        cross_attention_dropout: 0.15
        cross_attention_heads: 2  # Minimal but functional attention
        cross_attention_layers: 2  # Single layer for memory efficiency
        dynedge_layer_sizes: [[128, 256], [256, 256], [256, 256]]  # Proven architecture
        exclude_tel_id_from_processing: true
        features_subset: [0, 1, 2]  # x_cam, y_cam, t (exclude tel_id)
        fusion_strategy: "late"  # Cross-attention after DynEdge processing
        global_pooling_schemes: [min, max, mean, sum]
        nb_inputs: 7  # Total input features including tel_id
        nb_neighbours: 12
        post_processing_layer_sizes: [512, 256]  # Larger for combined telescope data
        readout_layer_sizes: [128]
        # Stereo-specific parameters - PRODUCTION SETTINGS
        tel_id_feature_idx: 3  # Index of telescope ID in features
        # dynedge_dropout: 0.1
      class_name: DynEdgeStereo
  graph_definition:
    ModelConfig:
      arguments:
        columns: [0, 1, 2]  # x_cam, y_cam, t for k-NN
        detector:
          ModelConfig:
            arguments: {}
            class_name: MAGICDetector
        dtype: null
        nb_nearest_neighbours: 12
        node_definition:
          ModelConfig:
            arguments: {}
            class_name: NodesAsPulses
      class_name: KNNGraph
  optimizer_class: '!class torch.optim.adamw AdamW'
  optimizer_kwargs: 
    eps: 1e-08
    lr: 2e-05
    weight_decay: 2e-04
  # scheduler_class: '!class torch.optim.lr_scheduler CosineAnnealingLR'
  # scheduler_config:
  #   interval: step
  # scheduler_kwargs:
  #   T_max: 120000
  #   eta_min: 1e-6
  scheduler_class: '!class torch.optim.lr_scheduler ReduceLROnPlateau'
  scheduler_config:
    interval: epoch
    monitor: val_loss
  scheduler_kwargs:
    mode: min
    factor: 0.2
    patience: 4  # Be a little more patient
    min_lr: 1e-7 # Allow it to decay further
  tasks:
  - ModelConfig:
      arguments:
        hidden_size: 128
        loss_function:
          ModelConfig:
            arguments: {}
            class_name: BinaryCrossEntropyLoss
        prediction_labels: [gamma_prob]
        target_labels: [particle_id]
        transform_prediction_and_target: null
        transform_support: null
        transform_target: null
      class_name: BinaryClassificationTask
class_name: StandardModel 
