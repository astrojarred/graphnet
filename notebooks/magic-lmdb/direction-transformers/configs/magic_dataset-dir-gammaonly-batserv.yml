path: /mnt/scratch/jgreen/MAGIC_LMDB_75k_cleaned_zd05to35/za05to35.lmdb
graph_definition:
  arguments:
    columns: [0, 1, 2]
    detector:
      arguments: {}
      class_name: MAGICDetector
    dtype: torch.float32
    nb_nearest_neighbours: 8
    node_definition:
      arguments: {}
      class_name: NodesAsPulses
    input_feature_names: ['x_cam', 'y_cam', 't', 'tel_id', 'signal', 'telescope_phi', 'telescope_theta']
  class_name: KNNGraph
pulsemaps:
  - total
features:
  - x_cam
  - y_cam
  - t
  - tel_id
  - signal
  - telescope_phi
  - telescope_theta
truth:
  - particle_id
  - true_energy
  - true_theta
  - true_phi
index_column: event_id
truth_table: truth
seed: 21
labels:
  direction:
    arguments:
      azimuth_key: "true_phi"
      zenith_key: "true_theta"
    class_name: Direction
selection:
  test: "event_id % 10 == 0 and particle_id == 1"
  validation: "event_id % 10 == 1 and particle_id == 1"
  train: "event_id % 10 > 1 and particle_id == 1"
# selection:  # ~1/6th dataset size
#   test: "event_id % 6 == 0 and (event_id // 6) % 10 == 0"      # ~2,000 events
#   validation: "event_id % 6 == 0 and (event_id // 6) % 10 == 1"  # ~2,000 events
#   train: "event_id % 6 == 0 and (event_id // 6) % 10 > 1"     # ~16,000 events
