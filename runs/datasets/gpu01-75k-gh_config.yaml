path: /scratch/jagre/LMDB_75k_gh/za05to35.lmdb
graph_definition:
  arguments:
    columns: [0, 1, 2]
    detector:
      arguments: {}
      class_name: MAGICDetectorFixed
    dtype: torch.float32
    nb_nearest_neighbours: 8
    node_definition:
      arguments: {}
      class_name: NodesAsPulses
    input_feature_names: ['x_cam', 'y_cam', 'tel_id', 't', 'signal']
  class_name: KNNGraph
pulsemaps:
  - total
features:
  - x_cam
  - y_cam
  - tel_id
  - t
  - signal
truth:
  - particle_id
  - true_energy
  - true_theta
  - true_phi
  - telescope_phi
  - telescope_theta
index_column: event_id
truth_table: truth
seed: 21
selection:
  test_proton: "event_id % 5 == 0 & particle_id == 14"
  test_gamma: "event_id % 5 == 0 & particle_id == 1"
  validation_proton: "event_id % 5 == 1 & particle_id == 14"
  validation_gamma: "event_id % 5 == 1 & particle_id == 1"
  train_proton: "event_id % 5 > 1 & particle_id == 14"
  train_gamma: "event_id % 5 > 1 & particle_id == 1"
