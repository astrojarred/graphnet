server {
    if ($host = lst1.iac.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.lst1.iac.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name www.lst1.iac.es lst1.iac.es;
    root         /usr/share/nginx/html;
    location / {
        return 302 https://$host$request_uri;
    }

}

server {
    listen	443 ssl default_server;
    http2 on;
    server_name  www.lst1.iac.es lst1.iac.es;
    client_max_body_size 1024M;
    client_body_buffer_size 8K;
    ssl_certificate /etc/letsencrypt/live/lst1.iac.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lst1.iac.es/privkey.pem; # managed by Certbot
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    ssl_stapling on;
    ssl_stapling_verify on;    ssl_session_cache shared:SSL:1m;
    rewrite ^/dcim1$ /dcim1/ redirect;
    rewrite ^/schneider$ /schneider/ redirect;

    include /etc/nginx/default.d/php.conf;
    fastcgi_read_timeout 300;

    #set $allowed_user "LST1"; 
    
    location / {
	root   /home/www/html;
        index  index.html index.htm index.php;
    }
    
    location /elog/ {
        root /home/www/html;
	rewrite ^/elog(/.*)$ $1 break;
        proxy_pass http://localhost:8090;

	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
		  
    }

    location ^~ /dailycheck/ {
         root /home/www/html;
         auth_basic "Password protected area";
         auth_basic_user_file /home/www/passwd/.htpasswd;

  	 location ~ \.php$ {
          include fastcgi_params;
          fastcgi_pass unix:/run/php-fpm/www.sock;  # Use the correct PHP-FPM socket
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          auth_basic "LST1 Dailycheck";
          auth_basic_user_file /home/www/passwd/.htpasswd;
        }
    }

    location ^~ /travel/ {
    	 root /home/www/html;
